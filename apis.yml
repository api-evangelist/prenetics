aid: prenetics
name: Prenetics
description: >-
  Prenetics Global Limited (NASDAQ: PRE) is a consumer healthcare and longevity
  company whose flagship brand is IM8, a science-backed daily-nutrition and
  longevity supplement line co-founded with David Beckham that reached roughly
  $120M in annual recurring revenue within its first year. The company's IM8
  Health direct-to-consumer storefront runs on Shopify and exposes an
  agent-native commerce surface: it publishes an /llms.txt agent guide and a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp that
  advertises a hosted Model Context Protocol (MCP) shopping endpoint, letting
  AI agents search the catalog, build carts, and drive buyer-approved checkout
  via Shop Pay, Google Pay, and Shopify card handlers. Prenetics itself
  publishes no separate developer/API program; the agent-commerce surface is the
  IM8 Health UCP/MCP storefront.
