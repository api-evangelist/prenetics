generated: '2026-07-20'
method: searched
status: published
source: https://im8health.com/.well-known/ucp
notes: >-
  IM8 Health (Prenetics' flagship consumer-supplement brand) runs on Shopify and
  exposes an agent-native commerce surface via the Universal Commerce Protocol
  (UCP, https://ucp.dev). The store's UCP merchant profile at
  https://im8health.com/.well-known/ucp advertises a hosted MCP endpoint for the
  UCP shopping service. The endpoint performs a UCP agent-profile handshake before
  it will answer tools/list (a raw JSON-RPC tools/list without a profile URI
  returns error -32001 invalid_profile_url), so the tool surface below is captured
  from the store's published /llms.txt agent flow and the UCP shopping OpenRPC
  schema it references, not fabricated.
server:
  name: im8-health-ucp-shopping
  transport: http
  protocol: mcp
  url: https://im8store.myshopify.com/api/ucp/mcp
  ucp_version: '2026-04-08'
  ucp_supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  openrpc_schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  spec: https://ucp.dev/2026-04-08/specification/overview/
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
payment_handlers:
- com.google.pay
- dev.shopify.card
- dev.shopify.shop_pay
tools:
- name: search_catalog
  description: Search the store catalog for products matching a buyer's intent.
  source: https://im8health.com/llms.txt
- name: create_cart
  description: Create a cart and add desired items.
  source: https://im8health.com/llms.txt
- name: create_checkout
  description: Start the purchase flow for a cart.
  source: https://im8health.com/llms.txt
- name: update_checkout
  description: Set shipping address and shipping method on a checkout.
  source: https://im8health.com/llms.txt
- name: complete_checkout
  description: Finalize the purchase. Requires explicit contemporaneous buyer approval of payment.
  source: https://im8health.com/llms.txt
rules:
- Checkout requires human approval; agents must not complete payment without explicit buyer consent.
- The MCP endpoint is rate-limited per IP; back off on HTTP 429.
- Pass buyer context (address_country, currency) for accurate pricing and availability.
