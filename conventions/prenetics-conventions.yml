generated: '2026-07-20'
method: searched
source: https://im8health.com/llms.txt
scope: >-
  Cross-cutting semantics for the IM8 Health agent-commerce surface (UCP shopping
  over MCP). Derived from the store's published /llms.txt and /.well-known/ucp;
  the storefront runs on Shopify.
authentication:
  style: none-for-read
  read_only: No authentication required for read-only catalog browsing (product/collection JSON endpoints).
  transact: Buyer approval required at the moment of payment; agents may route payment through Shop Pay (https://shop.app/SKILL.md) to satisfy the buyer-approval invariant.
buyer_approval:
  required: true
  detail: Checkout must not be completed without explicit contemporaneous buyer consent to payment.
rate_limiting:
  signal: HTTP 429
  detail: The UCP MCP endpoint is rate-limited per IP; clients must back off on 429 responses.
buyer_context:
  fields:
  - context.address_country
  - context.currency
  detail: Pass buyer context for accurate pricing and availability.
read_only_endpoints:
  products_json: GET /products/{handle}.json
  collection_json: GET /collections/{handle}/products.json
  search: GET /search?q={query}&type=product
  sitemap: GET /sitemap.xml
agent_flow:
- Discover — GET /.well-known/ucp to confirm capabilities
- Search — search_catalog to find products
- Cart — create_cart to add items
- Checkout — create_checkout to start the purchase
- Fulfill — update_checkout to set shipping address and method
- Complete — complete_checkout (buyer must approve payment)
cross_links:
  mcp: mcp/prenetics-mcp.yml
  well_known: well-known/prenetics-well-known.yml
  llms: llms/prenetics-llms.txt
